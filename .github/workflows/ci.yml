name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: api (ruff + pytest)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/api
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: arbiter
          POSTGRES_PASSWORD: arbiter
          POSTGRES_DB: arbiter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arbiter -d arbiter_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      ARBITER_ENV: test
      ARBITER_TEST_DATABASE_URL: postgresql+psycopg://arbiter:arbiter@localhost:5432/arbiter_test
      ARBITER_DATABASE_URL: postgresql+psycopg://arbiter:arbiter@localhost:5432/arbiter_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e '.[dev]'
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .
      - name: pytest
        run: pytest -q

  web:
    name: web (lint + tsc + build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build

  docker:
    name: docker build (${{ matrix.image }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: services/api
            file: services/api/Dockerfile
          - image: web
            context: apps/web
            file: deploy/web.Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          tags: arbiter-${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  compose:
    name: compose config
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose files
        env:
          DOMAIN: example.com
          ACME_EMAIL: ops@example.com
          POSTGRES_PASSWORD: ci
          ARBITER_JWT_SECRET: ci-secret-not-used
        run: |
          docker compose -f deploy/docker-compose.yml config -q
          docker compose -f deploy/docker-compose.dev.yml config -q

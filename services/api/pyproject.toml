[project]
name = "arbiter-api"
version = "0.1.0"
description = "Arbiter: AI-native translation platform. Core API, quality estimation, senate, pipeline."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0.32",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "lxml>=5.3",
  "pysbd>=0.3.4",
  "rapidfuzz>=3.9",
  "snowballstemmer>=2.2",
  "pyjwt>=2.9",
  "argon2-cffi>=23.1",
  "reportlab>=4.2",
  "orjson>=3.10",
  "tenacity>=9.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "mypy>=1.11",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "python-pptx>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["arbiter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008"]
